name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Publish app
        working-directory: app
        run: dotnet publish -c Release -o ../dist -p:Version=${{ steps.version.outputs.value }}

      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DAppVersion=${{ steps.version.outputs.value }} installer\thermal.iss

      - uses: actions/upload-artifact@v4
        with:
          name: thermal-${{ steps.version.outputs.value }}
          path: |
            dist/Thermal.exe
            dist/Thermal-Setup-*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Thermal.exe
            dist/Thermal-Setup-*.exe
